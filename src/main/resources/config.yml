# GuardianAC Configuration
# punishment: none / kick / ban

settings:
  plugin-name: "&cGuardianAC"
  prefix: "&8[&bGuardianAC&8] &r"
  console-alerts: true
  alert-threshold: 1

checks:
  speed:
    enabled: true
    max-violations: 25
    decay-seconds: 6
    max-speed: 0.5
    sprint-multiplier: 1.3
    punishment: none

  flight:
    enabled: true
    max-violations: 15
    decay-seconds: 6
    max-air-ticks: 10
    punishment: none

  reach:
    enabled: true
    max-violations: 20
    decay-seconds: 6
    max-reach: 3.5
    punishment: none

  killaura:
    enabled: true
    max-violations: 20
    decay-seconds: 6
    max-angle: 75.0
    min-attack-delay: 55
    punishment: none

  autoclicker:
    enabled: true
    max-violations: 25
    decay-seconds: 6
    max-cps: 18.0
    punishment: none

  nofall:
    enabled: true
    max-violations: 15
    decay-seconds: 6
    punishment: none

  jesus:
    enabled: true
    max-violations: 15
    decay-seconds: 6
    punishment: none

  step:

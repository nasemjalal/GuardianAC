# GuardianAC Configuration
# Anti-Cheat plugin for Paper 1.21

settings:
  prefix: "&8[&bGuardianAC&8] &r"
  console-alerts: true
  alert-threshold: 1

checks:
  speed:
    enabled: true
    max-violations: 25
    decay-seconds: 15
    max-speed: 0.5

  flight:
    enabled: true
    max-violations: 15
    decay-seconds: 15
    max-air-ticks: 10

  reach:
    enabled: true
    max-violations: 20
    decay-seconds: 12
    max-reach: 3.5

  killaura:
    enabled: true
    max-violations: 20
    decay-seconds: 10
    max-angle: 65.0
    min-attack-delay: 55

  autoclicker:
    enabled: true
    max-violations: 25
    decay-seconds: 8
    max-cps: 18.0

  nofall:
    enabled: true
    max-violations: 15
    decay-seconds: 15

  jesus:
    enabled: true
    max-violations: 15
    decay-seconds: 12

  step:
    enabled: true
    max-violations: 12
    decay-seconds: 15
    max-step: 1.0

  noslow:
    enabled: true
    max-violations: 20
    decay-seconds: 15

  timer:
    enabled: true
    max-violations: 10
    decay-seconds: 15

  fastplace:
    enabled: true
    max-violations: 15
    decay-seconds: 10
    min-delay: 100

  scaffold:
    enabled: true
    max-violations: 10
    decay-seconds: 15

  criticals:
    enabled: true
    max-violations: 12
    decay-seconds: 15

  velocity:
    enabled: true
    max-violations: 15
    decay-seconds: 12

  phase:
    enabled: true
    max-violations: 8
    decay-seconds: 20

  inventorymove:
    enabled: true
    max-violations: 10
    decay-seconds: 15

  fastbreak:
    enabled: true
    max-violations: 15
    decay-seconds: 10
    min-delay: 60

  blockreach:
    enabled: true
    max-violations: 15
    decay-seconds: 12
    max-reach: 4.5

  nuker:
    enabled: true
    max-violations: 12
    decay-seconds: 15
    max-blocks-per-tick: 3

  wallhack:
    enabled: true
    max-violations: 12
    decay-seconds: 12

  elytra:
    enabled: true
    max-violations: 10
    decay-seconds: 15
